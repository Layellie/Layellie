name: Generate Metrics

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate metrics panel
        uses: lowlighter/metrics@v3.34
        with:
          # GITHUB_TOKEN only sees this repo (1 repository, 0 languages).
          # METRICS_TOKEN is a personal access token that can read all repos.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Layellie
          filename: github-metrics.svg
          template: classic
          base: header, activity
          config_timezone: Europe/Istanbul
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
